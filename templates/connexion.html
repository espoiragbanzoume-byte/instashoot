{% extends "base.html" %}

{% block title %}Connexion — InstaShoot{% endblock %}

{% block content %}

  <section class="auth-container">
    <h1>Se connecter</h1>

    {% if message %}
      <p class="auth-message">{{ message }}</p>
    {% endif %}

    <form class="auth-form" method="post">
      <input type="hidden" name="next" value="{{ next }}">

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Mot de passe</label>
      <div class="password-field"><input type="password" name="mot_de_passe" required><button type="button" class="password-toggle" aria-label="Afficher le mot de passe" title="Afficher le mot de passe">
  <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
    <circle cx="12" cy="12" r="2.5"/>
  </svg>
  <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 3l18 18"/>
    <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.4 18.4 0 0 1-3.1 3.8"/>
    <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1"/>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
  </svg>
</button></div>

      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <p class="auth-switch">Pas encore de compte ? <a href="{{ url_for('inscription') }}">S'inscrire</a></p>
  </section>

{% endblock %}
